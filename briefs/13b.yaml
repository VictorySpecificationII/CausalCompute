# CausalCompute brief — 13B model, 3T tokens, 30 days
#
# All quantities in SI units (bytes, seconds, FLOP/s).
# Device specs describe a single accelerator (e.g. H100 SXM).

workload:
  P: 13e9          # 13 billion parameters
  Tok: 3e12        # 3 trillion training tokens
  T: 2592000       # 30 days in seconds
  c: 6.0           # FLOPs per param-token (dense transformer)

state_bytes:
  b_w: 2.0         # weight bytes/param   (bf16)
  b_g: 2.0         # gradient bytes/param (bf16)
  b_opt: 8.0       # optimizer bytes/param (Adam: m+v in fp32)

io:
  b_tok: 2.0       # bytes/token in dataset stream
  A_io: 1.3        # dataset BW headroom multiplier
  b_ckpt: 2.0      # bytes/param written per checkpoint
  t_ckpt_max: 300  # max tolerable checkpoint duration [s]

device:
  F_dev_sust_flop_s: 1e15    # 1 PFLOP/s sustained (H100 SXM BF16 ~1 PFLOP/s peak)
  B_dev_mem_bytes: 8e10      # 80 GiB HBM3

step:
  B_step_bytes: 1.5e11       # 150 GB global instantaneous working set
  Tok_per_step: 4e7          # 40M tokens per update step
  update:
    b_update_per_param: 2.0  # gradient bytes per param exchanged
    k_update: 1.0            # payload margin multiplier

capabilities:
  fabric:
    BW_node_sust_Bps: 1e11   # 100 GB/s per node (e.g. HDR/NDR InfiniBand)
  storage:
    BW_ckpt_sust_Bps: 5e9   # 5 GB/s checkpoint write BW
  checkpoint_policy:
    seconds_per_ckpt: 3600   # checkpoint every hour

design:
  G: null                    # null → auto-size smallest feasible cluster
  gpus_per_node: 8
  eta_compute: 0.35          # sustained / peak compute ratio
  eta_fabric: 0.80           # effective / line-rate BW ratio
  tp_max: 16
  pp_max: 16
  g_max_multiplier: 8        # search up to 8× N_min
  comm_model: ring_allreduce_dp_only
  zero_stage: 0                # 0=full replica, 1=opt sharded, 2=grad+opt, 3=full ZeRO

network:
  nics_per_node: 8           # 1 per GPU — rail-optimised HPC
  switch_radix: 64           # NDR InfiniBand / 400GbE
  port_bw_Bps: 5.0e10        # 400 Gb/s = 50 GB/s per port
  oversubscription: 1.0      # 1:1 full bisection
  rail_optimised: true       # each NIC on its own leaf (rail)

compute_node:
  intra_node_bw_Bps: 9.0e11     # NVLink4: 900 GB/s bisection per node (H100 SXM HGX)
  gpudirect_rdma: true           # NIC DMA directly to/from GPU HBM
  cpu_cores_per_node: 128        # 2× AMD EPYC Genoa 64-core (or equivalent)
  dram_bytes_per_node: 2.0e12   # 2 TB system DRAM per node
  root_complex: dual_socket      # single_socket | dual_socket | cascade

storage_design:
  drive_bw_seq_Bps: 7.0e9       # 7 GB/s sequential (NVMe SSD)
  drive_capacity_bytes: 7.68e12  # 7.68 TB per drive (enterprise NVMe)
  drives_per_storage_node: 24    # JBOF or dense storage node
  storage_net_bw_Bps: 2.5e10    # 25 GB/s per storage node to fabric
  dataset_replication: 1         # no dataset replication (compute cluster reads once)
  ckpt_replication: 2            # 2 copies per checkpoint generation
  ckpt_keep_count: 3             # 3 rolling checkpoint generations

cost:
  # Ballpark ~2024 market rates — adjust to current quotes before use.
  gpu_unit_cost: 30000          # $ per GPU (H100 SXM list ~$30k)
  node_chassis_cost: 15000      # $ per compute node (chassis + CPU + DRAM, ex-GPU/NIC)
  nic_unit_cost: 2500           # $ per NIC (NDR InfiniBand)
  switch_unit_cost: 40000       # $ per switch (NDR 64-port)
  cable_unit_cost: 100          # $ per cable (AOC 2m)
  storage_node_cost: 20000      # $ per storage node (chassis + CPU + DRAM, ex-drives)
  drive_unit_cost: 2500         # $ per NVMe SSD (7.68 TB enterprise)
  rack_unit_cost: 3000          # $ per rack (cage + PDU + cabling)
  electricity_usd_kwh: 0.07     # $/kWh (US industrial average)
  capex_amortization_years: 3.0  # amortization period (years)

power_thermals:
  power:
    P_gpu_W: 700.0
    P_cpu_W_per_node: 250.0
    P_other_W_per_node: 300.0   # DRAM + NICs + MB + margin
    PUE: 1.30
  cooling:
    mode: liquid               # air | liquid
    deltaT_air_C: 15.0
    deltaT_liquid_C: 12.0
  rack:
    nodes_per_rack: null       # null → skip rack sanity
    rack_power_limit_W: null
    racks: null
